<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>m0s4r | المكتبة</title>
<style>
:root{--bg:#f3f6fd;--surf:#ffffffd9;--card:#fff;--tx:#0b1530;--mut:#5b6785;--bl:#1d4ed8;--bl2:#2563eb;--bd:#dbe3f5;--glow:#3b82f633;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#070b16;--surf:#0b1124d9;--card:#101830;--tx:#e8eeff;--mut:#8a97b8;--bl:#60a5fa;--bl2:#3b82f6;--bd:#1d2848;--glow:#3b82f640}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;min-height:100vh;padding-bottom:90px}
button{font:inherit;color:inherit;cursor:pointer}
/* header */
header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surf);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--bd);background:var(--card);display:grid;place-items:center;flex:none;transition:.15s}
.ib:hover{border-color:var(--bl2);box-shadow:0 0 0 3px var(--glow)}
.ib svg{width:22px;height:22px;stroke:var(--bl);fill:none;stroke-width:2;stroke-linecap:round}
.search{flex:1;position:relative;min-width:0}
.search input{width:100%;font:inherit;padding:11px 42px 11px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);outline:none}
.search input:focus{border-color:var(--bl2);box-shadow:0 0 0 3px var(--glow)}
.search svg{position:absolute;inset-inline-start:auto;right:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:2;pointer-events:none}
#av{font-weight:700;color:var(--bl)}
#pm{position:fixed;left:12px;top:calc(62px + env(safe-area-inset-top,0px));width:250px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 18px 40px #0004;z-index:40;display:none}
#pm.on{display:block}
#pm .em{font-size:.85rem;color:var(--mut);word-break:break-all;margin-bottom:6px}
#pm .rl{display:inline-block;font-size:.75rem;padding:3px 10px;border-radius:20px;background:var(--glow);color:var(--bl);margin-bottom:10px}
.btn{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 14px}
.btn.pri{background:linear-gradient(135deg,var(--bl2),#1e40af);color:#fff;border-color:transparent;font-weight:600}
.btn.rec{background:#c62828;color:#fff;border-color:transparent}
.btn.full{width:100%}
/* drawer */
#ov{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:.25s;z-index:50}
#ov.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;bottom:0;right:0;width:min(78vw,290px);background:var(--card);border-inline-start:1px solid var(--bd);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:60;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;display:flex;flex-direction:column;gap:6px}
#dr.on{transform:none}
#dr .lg{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.7rem;font-weight:800;direction:ltr;text-align:right;background:linear-gradient(135deg,var(--bl),#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent;margin:4px 8px 14px}
.nv{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid transparent;background:none;text-align:start;width:100%}
.nv .ic{font-size:1.3rem}.nv .ct{margin-inline-start:auto;font-size:.8rem;color:var(--mut)}
.nv:hover{background:var(--glow)}
.nv.on{background:linear-gradient(135deg,var(--bl2),#1e40af);color:#fff}.nv.on .ct{color:#dbeafe}
#dr .ft{margin-top:auto;color:var(--mut);font-size:.8rem;padding:8px}
/* content */
main{max-width:1100px;margin:0 auto;padding:18px 14px}
h1{margin:6px 0 4px;font-size:1.8rem;background:linear-gradient(135deg,var(--bl),var(--bl2));-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
#msg{min-height:1.3em;color:var(--mut);font-size:.88rem;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.cd{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.cd:hover{transform:translateY(-3px);border-color:var(--bl2);box-shadow:0 10px 26px var(--glow)}
.cd.pl{border-color:var(--bl2);box-shadow:0 0 0 2px var(--bl2) inset}
.th{position:relative;aspect-ratio:16/11;background:linear-gradient(135deg,#0f2a6b,#1e40af 55%,#3b82f6);display:grid;place-items:center;overflow:hidden}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .ph{font-size:2.6rem;filter:drop-shadow(0 4px 10px #0006)}
.th .bd{position:absolute;bottom:8px;inset-inline-end:8px;background:#000a;color:#fff;font-size:.7rem;padding:2px 8px;border-radius:8px}
.th .pp{position:absolute;inset:0;display:grid;place-items:center}
.th .pp span{width:46px;height:46px;border-radius:50%;background:#000a;color:#fff;display:grid;place-items:center;font-size:1.1rem;backdrop-filter:blur(4px)}
.eq{display:none;gap:3px;align-items:flex-end;height:26px;position:absolute;bottom:10px;inset-inline-start:10px}
.cd.pl .eq{display:flex}.eq i{width:4px;background:#fff;border-radius:2px;animation:eq 0.8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
@keyframes eq{from{height:4px}to{height:24px}}
.mt{padding:10px 12px 8px;display:flex;flex-direction:column;gap:6px}
.mt .nm{font-size:.92rem;word-break:break-word;line-height:1.35}
.tl{display:flex;gap:4px;justify-content:flex-end}
.tl button{border:1px solid var(--bd);background:none;border-radius:9px;padding:3px 9px;font-size:.8rem;color:var(--mut)}
.tl button:hover{color:var(--bl);border-color:var(--bl2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 0}
/* player */
#pb{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);width:min(94vw,560px);background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 36px #0005;transition:.3s;z-index:35}
#pb.on{transform:translate(-50%,0)}
#pbp{width:42px;height:42px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--bl2),#1e40af);color:#fff;flex:none}
#pbi{flex:1;min-width:0}#pbn{font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;accent-color:var(--bl2)}#tm{font-size:.72rem;color:var(--mut);direction:ltr;text-align:right}
/* lightbox + dialog */
.lb{position:fixed;inset:0;background:#000e;display:grid;place-items:center;z-index:90;padding:14px;cursor:zoom-out}
.lb img,.lb video{max-width:100%;max-height:100%;border-radius:12px}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);padding:20px;width:min(92vw,360px)}
dialog::backdrop{background:#0009}
dialog input{display:block;width:100%;font:inherit;padding:11px;margin:8px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.tabs2{display:flex;gap:6px;margin-bottom:8px}.tabs2 button{flex:1;padding:8px;border-radius:12px;border:1px solid var(--bd);background:none}
.tabs2 button.on{background:var(--bl2);color:#fff;border-color:var(--bl2)}
#am{color:var(--mut);font-size:.85rem;min-height:1.2em;margin:4px 0 8px}
/* intro */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;cursor:pointer;overflow:hidden}
.ip{position:absolute;left:0;right:0;height:50.5%;background:#04070f;transition:transform 1s cubic-bezier(.7,0,.2,1);z-index:1}
.ip.t{top:0;background:radial-gradient(120% 140% at 50% 100%,#0b1d4a,#04070f 70%)}
.ip.b{bottom:0;background:radial-gradient(120% 140% at 50% 0%,#0b1d4a,#04070f 70%)}
#intro.out .ip.t{transform:translateY(-101%)}#intro.out .ip.b{transform:translateY(101%)}
.ic2{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px;transition:opacity .5s}
#intro.out .ic2{opacity:0}
.ring{position:absolute;width:min(78vw,400px);aspect-ratio:1;border-radius:50%;top:50%;left:50%;margin:calc(min(78vw,400px)/-2 - 34px) 0 0 calc(min(78vw,400px)/-2);background:conic-gradient(from 0deg,transparent 0 55%,#2563eb 82%,#bfdbfe 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1px));filter:drop-shadow(0 0 14px #3b82f6);animation:spin 3.2s linear infinite,fade 1.2s .2s both}
.glow{position:absolute;width:520px;height:520px;max-width:120vw;border-radius:50%;background:radial-gradient(circle,#2563eb55,transparent 65%);top:50%;left:50%;transform:translate(-50%,-60%);animation:pulse 2.4s ease-in-out infinite alternate}
#word{display:flex;direction:ltr;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:clamp(3.2rem,17vw,6.4rem);line-height:1}
#word span{opacity:0;background:linear-gradient(120deg,#93c5fd,#fff 45%,#3b82f6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) forwards,shine 2.4s 1.6s linear infinite}
.ln{height:2px;width:0;background:linear-gradient(90deg,transparent,#60a5fa,transparent);box-shadow:0 0 14px #3b82f6;animation:ln 1.2s 1.7s cubic-bezier(.2,.8,.2,1) forwards}
.tg{color:#9db4e8;letter-spacing:.35em;font-size:.85rem;opacity:0;animation:fade 1s 2.3s forwards}
@keyframes rise{0%{opacity:0;filter:blur(18px);transform:translateY(26px) scale(1.5)}100%{opacity:1;filter:blur(0);transform:none}}
@keyframes shine{to{background-position:-200% 0}}
@keyframes ln{to{width:min(70vw,300px)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{from{opacity:.55;transform:translate(-50%,-60%) scale(.9)}to{opacity:1;transform:translate(-50%,-60%) scale(1.08)}}
@media (prefers-reduced-motion:reduce){#word span,.tg,.ring,.glow,.ln{animation-duration:.01s;animation-iteration-count:1}}
</style>
</head>
<body>
<div id="intro"><div class="ip t"></div><div class="ip b"></div>
  <div class="ic2"><div class="glow"></div><div class="ring"></div><div id="word"></div><div class="ln"></div><div class="tg">THE LIBRARY</div></div>
</div>

<header>
  <button class="ib" id="menuBtn" aria-label="القائمة"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="search"><input id="q" type="search" placeholder="ابحث بالاسم…" autocomplete="off"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></div>
  <button class="ib" id="profBtn" aria-label="الحساب"><span id="av"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span></button>
</header>
<div id="pm"></div>

<div id="ov"></div>
<nav id="dr">
  <div class="lg">m0s4r</div>
  <button class="nv on" data-t="all"><span class="ic">🗂️</span>الكل<span class="ct" id="c-all">0</span></button>
  <button class="nv" data-t="mus"><span class="ic">🎵</span>الموسيقى<span class="ct" id="c-mus">0</span></button>
  <button class="nv" data-t="img"><span class="ic">🖼️</span>الصور<span class="ct" id="c-img">0</span></button>
  <button class="nv" data-t="vid"><span class="ic">🎬</span>الفيديوهات<span class="ct" id="c-vid">0</span></button>
  <div class="ft">m0s4r © مكتبتك الخاصة</div>
</nav>

<main>
  <h1 id="ttl">الكل</h1>
  <p class="sub">أضف موسيقى وصور وفيديوهات، واضغط على أي ملف لتشغيله أو عرضه.</p>
  <div class="bar">
    <button class="btn pri" id="addBtn">＋ إضافة ملفات</button>
    <button class="btn" id="recBtn">🎙️ تسجيل</button>
    <input type="file" id="file" accept="audio/*,image/*,video/*" multiple hidden>
  </div>
  <div id="msg"></div>
  <div class="grid" id="grid"></div>
</main>

<div id="pb"><button id="pbp">⏸</button><div id="pbi"><div id="pbn"></div><input type="range" id="seek" min="0" max="1000" value="0"><div id="tm">0:00 / 0:00</div></div></div>

<dialog id="dlg">
  <div class="tabs2"><button class="on" data-m="in">تسجيل الدخول</button><button data-m="up">حساب جديد</button></div>
  <input id="em" type="email" placeholder="الإيميل" dir="ltr" autocomplete="username">
  <input id="pw" type="password" placeholder="كلمة السر" dir="ltr" autocomplete="current-password">
  <div id="am"></div>
  <div style="display:flex;gap:8px"><button class="btn pri" id="go" style="flex:1">متابعة</button><button class="btn" id="cancel">إلغاء</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== انسخ السطرين دول من موقعك القديم (نفس مشروع Supabase) ===== */
const SUPABASE_URL = 'https://mqidkocselprkowgsvnt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xaWRrb2NzZWxwcmtvd2dzdm50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1MjE5MzQsImV4cCI6MjEwOTA5NzkzNH0.JaJ1GKOk-GKhiDuALfvVCEYHqNweYMonfARm_dkEbTg';
/* ================================================================= */
const $=s=>document.querySelector(s);
const TITLES={all:'الكل',mus:'الموسيقى',img:'الصور',vid:'الفيديوهات'};
const MAXB=5*1024*1024*1024;
let sb=null, me=null, isAdmin=false, tab='all', q='', items=[], sig='', cur=null, authMode='in';
const aud=new Audio();
const store=()=>sb.storage.from('library');
const say=t=>{$('#msg').textContent=t||''};
const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const isMus=i=>i.kind==='aud'||i.kind==='rec';

/* ---------- البداية ---------- */
async function init(){
  if(SUPABASE_URL.startsWith('PASTE')){ say('حط بيانات Supabase في أول الكود.'); return; }
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data}=await sb.auth.getSession(); await setUser(data.session?data.session.user:null);
  sb.auth.onAuthStateChange((_e,s)=>{ setTimeout(()=>setUser(s?s.user:null),0) });
  await load(); setInterval(load,15000);
}
async function setUser(u){
  me=u; isAdmin=false;
  if(u){ try{ const r=await sb.rpc('is_admin'); isAdmin=r.data===true }catch(e){} }
  const av=$('#av');
  if(u){ av.textContent=(u.email||'?')[0].toUpperCase() } else { av.innerHTML='<svg viewBox="0 0 24 24" style="width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>' }
  drawMenu(); render();
}
async function load(){
  if(!sb) return;
  const {data,error}=await sb.from('library').select('*').order('created_at',{ascending:false});
  if(error){ say('تعذّر التحميل: '+error.message); return; }
  const n=JSON.stringify(data.map(r=>[r.id,r.name])); if(n===sig) return; sig=n;
  items=data.map(r=>({...r,url:store().getPublicUrl(r.path).data.publicUrl})); render();
}

/* ---------- الحساب ---------- */
function drawMenu(){
  const pm=$('#pm'); pm.innerHTML='';
  if(me){
    const e=document.createElement('div'); e.className='em'; e.textContent=me.email;
    const r=document.createElement('div'); r.className='rl'; r.textContent=isAdmin?'👑 أدمن: تحكم كامل':'👤 عضو: يضيف ويدير ملفاته';
    const b=document.createElement('button'); b.className='btn full'; b.textContent='تسجيل الخروج';
    b.onclick=async()=>{ pm.classList.remove('on'); await sb.auth.signOut() };
    pm.append(e,r,b);
  } else {
    const t=document.createElement('div'); t.className='em'; t.textContent='أنت مشاهد. سجّل دخولك عشان تضيف ملفات.';
    const b=document.createElement('button'); b.className='btn pri full'; b.textContent='تسجيل الدخول / حساب جديد';
    b.onclick=()=>{ pm.classList.remove('on'); openAuth('') };
    pm.append(t,b);
  }
}
$('#profBtn').onclick=e=>{ e.stopPropagation(); $('#pm').classList.toggle('on') };
document.addEventListener('click',e=>{ if(!e.target.closest('#pm')) $('#pm').classList.remove('on') });
function openAuth(m){ $('#am').textContent=m||''; $('#dlg').showModal() }
$('#cancel').onclick=()=>$('#dlg').close();
document.querySelectorAll('.tabs2 button').forEach(b=>b.onclick=()=>{ authMode=b.dataset.m; document.querySelectorAll('.tabs2 button').forEach(x=>x.classList.toggle('on',x===b)) });
$('#go').onclick=async()=>{
  if(!sb) return; const email=$('#em').value.trim(), password=$('#pw').value;
  if(!email||password.length<6){ $('#am').textContent='اكتب الإيميل وكلمة سر 6 حروف على الأقل.'; return; }
  $('#am').textContent='لحظة…';
  const r=authMode==='in'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
  if(r.error){ $('#am').textContent=r.error.message; return; }
  if(authMode==='up'&&!r.data.session){ $('#am').textContent='اتبعتلك رسالة تأكيد على الإيميل. أكّد وبعدها سجّل دخولك.'; return; }
  $('#pw').value=''; $('#dlg').close();
};

/* ---------- القائمة الجانبية ---------- */
const dr=$('#dr'), ov=$('#ov');
const toggleDr=v=>{ dr.classList.toggle('on',v); ov.classList.toggle('on',v) };
$('#menuBtn').onclick=()=>toggleDr(true); ov.onclick=()=>toggleDr(false);
document.querySelectorAll('.nv').forEach(b=>b.onclick=()=>{ tab=b.dataset.t; document.querySelectorAll('.nv').forEach(x=>x.classList.toggle('on',x===b)); $('#ttl').textContent=TITLES[tab]; toggleDr(false); render() });
$('#q').oninput=e=>{ q=e.target.value.trim().toLowerCase(); render() };

/* ---------- العرض ---------- */
const canEdit=it=>isAdmin||(me&&it.by===me.id);
function match(i){ return tab==='all'||(tab==='mus'&&isMus(i))||(tab==='img'&&i.kind==='img')||(tab==='vid'&&i.kind==='vid') }
function render(){
  $('#c-all').textContent=items.length; $('#c-mus').textContent=items.filter(isMus).length;
  $('#c-img').textContent=items.filter(i=>i.kind==='img').length; $('#c-vid').textContent=items.filter(i=>i.kind==='vid').length;
  const list=items.filter(i=>match(i)&&(!q||i.name.toLowerCase().includes(q)));
  const g=$('#grid'); g.innerHTML='';
  if(!list.length){ g.innerHTML='<div class="empty">'+(q?'ما لقيت نتيجة لـ «'+q.replace(/[<>&]/g,'')+'»':'ما في شي هنا بعد.')+'</div>'; return; }
  list.forEach(it=>{
    const c=document.createElement('div'), playing=cur&&cur.id===it.id&&!aud.paused;
    c.className='cd'+(playing?' pl':'');
    const th=document.createElement('div'); th.className='th';
    if(it.kind==='img'){ const im=document.createElement('img'); im.src=it.url; im.loading='lazy'; im.alt=''; th.append(im); if(it.mime==='image/gif'){ const b=document.createElement('span'); b.className='bd'; b.textContent='GIF'; th.append(b) } }
    else if(it.kind==='vid'){ const v=document.createElement('video'); v.src=it.url+'#t=0.5'; v.preload='metadata'; v.muted=true; v.playsInline=true; th.append(v); const p=document.createElement('div'); p.className='pp'; p.innerHTML='<span>▶</span>'; th.append(p) }
    else { const p=document.createElement('span'); p.className='ph'; p.textContent=it.kind==='rec'?'🎙️':'🎵'; th.append(p); th.insertAdjacentHTML('beforeend','<div class="eq"><i></i><i></i><i></i><i></i></div>') }
    const mt=document.createElement('div'); mt.className='mt';
    const nm=document.createElement('div'); nm.className='nm'; nm.textContent=it.name;
    const tl=document.createElement('div'); tl.className='tl';
    const dl=document.createElement('button'); dl.textContent='⬇'; dl.title='تنزيل';
    dl.onclick=e=>{ e.stopPropagation(); const ext=(it.path.split('.').pop()||''); const a=document.createElement('a'); a.href=store().getPublicUrl(it.path,{download:it.name+'.'+ext}).data.publicUrl; document.body.append(a); a.click(); a.remove() };
    tl.append(dl);
    if(canEdit(it)){
      const ed=document.createElement('button'); ed.textContent='✎'; ed.title='تعديل الاسم';
      ed.onclick=async e=>{ e.stopPropagation(); const n=prompt('اسم جديد',it.name); if(n&&n.trim()){ const r=await sb.from('library').update({name:n.trim()}).eq('id',it.id); if(r.error) say('ما قدرت أعدّل: '+r.error.message); sig=''; load() } };
      const de=document.createElement('button'); de.textContent='🗑'; de.title='حذف';
      de.onclick=async e=>{ e.stopPropagation(); if(!confirm('حذف «'+it.name+'»؟')) return;
        if(cur&&cur.id===it.id){ aud.pause(); cur=null; $('#pb').classList.remove('on') }
        await store().remove([it.path]); const r=await sb.from('library').delete().eq('id',it.id);
        if(r.error) say('ما قدرت أحذف: '+r.error.message); sig=''; load() };
      tl.append(ed,de);
    }
    mt.append(nm,tl); c.append(th,mt); c.onclick=()=>openItem(it); g.append(c);
  });
}

/* ---------- التشغيل والعرض ---------- */
function openItem(it){
  if(isMus(it)) return playAud(it);
  const lb=document.createElement('div'); lb.className='lb';
  let el; if(it.kind==='img'){ el=document.createElement('img'); el.src=it.url; el.alt=it.name } else { aud.pause(); el=document.createElement('video'); el.src=it.url; el.controls=true; el.autoplay=true; el.playsInline=true; lb.style.cursor='default' }
  lb.append(el); const close=()=>{ if(el.pause) el.pause(); lb.remove(); document.removeEventListener('keydown',k) };
  const k=e=>{ if(e.key==='Escape') close() }; document.addEventListener('keydown',k);
  lb.onclick=e=>{ if(e.target===lb||it.kind==='img') close() }; document.body.append(lb);
}
function playAud(it){
  if(cur&&cur.id===it.id){ aud.paused?aud.play():aud.pause(); return; }
  cur=it; aud.src=it.url; aud.play().catch(()=>say('تعذّر تشغيل هذا الملف'));
  $('#pbn').textContent=it.name; $('#pb').classList.add('on'); render();
}
aud.onplay=aud.onpause=()=>{ $('#pbp').textContent=aud.paused?'▶':'⏸'; render() };
aud.onended=()=>{ cur=null; $('#pb').classList.remove('on'); render() };
aud.ontimeupdate=()=>{ if(aud.duration) $('#seek').value=aud.currentTime/aud.duration*1000; $('#tm').textContent=fmt(aud.currentTime)+' / '+fmt(aud.duration) };
$('#seek').oninput=e=>{ if(aud.duration) aud.currentTime=e.target.value/1000*aud.duration };
$('#pbp').onclick=()=>{ aud.paused?aud.play():aud.pause() };

/* ---------- إضافة ---------- */
async function addBlob(blob,name,kind,i,n){
  if(blob.size>MAXB){ say('«'+name+'» كبير جداً.'); return false; }
  say('جاري رفع «'+name+'» ('+i+'/'+n+')… الملفات الكبيرة ممكن تاخد وقت.');
  const mime=(blob.type||'').split(';')[0]||'application/octet-stream';
  const ext=((blob.name||'').split('.').pop()||mime.split('/')[1]||'bin').replace(/[^a-z0-9]/gi,'').slice(0,5)||'bin';
  const path=me.id+'/'+crypto.randomUUID()+'.'+ext;
  const up=await store().upload(path,blob,{contentType:mime});
  if(up.error){ say('فشل الرفع: '+up.error.message); return false; }
  const ins=await sb.from('library').insert({name,kind,mime,path});
  if(ins.error){ await store().remove([path]); say('فشلت الإضافة: '+ins.error.message); return false; }
  return true;
}
async function addFiles(files){
  if(!sb) return; if(!me){ openAuth('سجّل دخولك الأول عشان تضيف ملفات.'); return; }
  const arr=[...files]; let ok=0;
  for(let i=0;i<arr.length;i++){
    const f=arr[i], t=f.type||'';
    const kind=t.startsWith('image/')?'img':t.startsWith('video/')?'vid':t.startsWith('audio/')?'aud':null;
    if(!kind){ say('«'+f.name+'» نوعه غير مدعوم.'); continue; }
    if(await addBlob(f,f.name.replace(/\.[^.]+$/,''),kind,i+1,arr.length)) ok++;
  }
  if(ok){ say(''); sig=''; await load(); }
}
$('#addBtn').onclick=()=>{ if(!me) openAuth('سجّل دخولك الأول عشان تضيف ملفات.'); else $('#file').click() };
$('#file').onchange=async e=>{ await addFiles(e.target.files); e.target.value='' };

/* ---------- التسجيل ---------- */
let mr=null,chunks=[],tmr=null,t0=0;
$('#recBtn').onclick=async()=>{
  const b=$('#recBtn');
  if(mr){ mr.stop(); return; }
  if(!me){ openAuth('سجّل دخولك الأول عشان تسجّل.'); return; }
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mr=new MediaRecorder(st); chunks=[];
    mr.ondataavailable=e=>chunks.push(e.data);
    mr.onstop=async()=>{
      st.getTracks().forEach(t=>t.stop()); clearInterval(tmr);
      const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'}); mr=null;
      b.textContent='🎙️ تسجيل'; b.className='btn'; say('');
      const n=prompt('اسم التسجيل','تسجيل '+(items.filter(i=>i.kind==='rec').length+1));
      if(await addBlob(blob,(n&&n.trim())||'تسجيل','rec',1,1)){ say(''); sig=''; await load() }
    };
    mr.start(); t0=Date.now(); b.className='btn rec';
    tmr=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); b.textContent='⏹ إيقاف '+fmt(s) },250);
  }catch(e){ say('ما قدرت أوصل للمايكروفون. تأكد من السماح بالصلاحية.') }
};

  const ov=$('#intro'), w=$('#word');
  [...'m0s4r'].forEach((ch,i)=>{ const s=document.createElement('span'); s.textContent=ch; s.style.animationDelay=(0.4+i*0.2)+'s,'+(1.6+i*0.15)+'s'; w.append(s) });

  ov.onclick=close; setTimeout(close,4300);
})();
render(); init();
